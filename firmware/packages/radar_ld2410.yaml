# Presence, fallback radar: HLK-LD2410C on UART at 256000 baud (Hi-Link LD2410C manual V1.00).
# Same wiring and entities as radar_ld2412.yaml, with the LD2410's 9 gates (0.75 m or 0.2 m each).
# Used for the side-by-side comparison on the first unit, or if an LD2412 arrives with bad firmware.

uart:
  id: uart_radar
  tx_pin: GPIO21     # XIAO D6 -> radar RX
  rx_pin: GPIO20     # XIAO D7 <- radar TX
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  id: radar
  uart_id: uart_radar

binary_sensor:
  - platform: ld2410
    ld2410_id: radar
    has_target:
      name: Presence
      device_class: occupancy
    has_moving_target:
      name: Moving target
    has_still_target:
      name: Still target

sensor:
  - platform: ld2410
    ld2410_id: radar
    moving_distance:
      name: Moving distance
    still_distance:
      name: Still distance
    moving_energy:
      name: Moving energy
    still_energy:
      name: Still energy
    detection_distance:
      name: Detection distance
    g0:
      move_energy:
        name: Gate 0 move energy
        disabled_by_default: true
      still_energy:
        name: Gate 0 still energy
        disabled_by_default: true
    g1:
      move_energy:
        name: Gate 1 move energy
        disabled_by_default: true
      still_energy:
        name: Gate 1 still energy
        disabled_by_default: true
    g2:
      move_energy:
        name: Gate 2 move energy
        disabled_by_default: true
      still_energy:
        name: Gate 2 still energy
        disabled_by_default: true
    g3:
      move_energy:
        name: Gate 3 move energy
        disabled_by_default: true
      still_energy:
        name: Gate 3 still energy
        disabled_by_default: true
    g4:
      move_energy:
        name: Gate 4 move energy
        disabled_by_default: true
      still_energy:
        name: Gate 4 still energy
        disabled_by_default: true
    g5:
      move_energy:
        name: Gate 5 move energy
        disabled_by_default: true
      still_energy:
        name: Gate 5 still energy
        disabled_by_default: true
    g6:
      move_energy:
        name: Gate 6 move energy
        disabled_by_default: true
      still_energy:
        name: Gate 6 still energy
        disabled_by_default: true
    g7:
      move_energy:
        name: Gate 7 move energy
        disabled_by_default: true
      still_energy:
        name: Gate 7 still energy
        disabled_by_default: true
    g8:
      move_energy:
        name: Gate 8 move energy
        disabled_by_default: true
      still_energy:
        name: Gate 8 still energy
        disabled_by_default: true

number:
  - platform: ld2410
    ld2410_id: radar
    timeout:
      name: Radar presence timeout
    max_move_distance_gate:
      name: Radar maximum move distance gate
    max_still_distance_gate:
      name: Radar maximum still distance gate
    g0:
      move_threshold:
        name: Gate 0 move threshold
      still_threshold:
        name: Gate 0 still threshold
    g1:
      move_threshold:
        name: Gate 1 move threshold
      still_threshold:
        name: Gate 1 still threshold
    g2:
      move_threshold:
        name: Gate 2 move threshold
      still_threshold:
        name: Gate 2 still threshold
    g3:
      move_threshold:
        name: Gate 3 move threshold
      still_threshold:
        name: Gate 3 still threshold
    g4:
      move_threshold:
        name: Gate 4 move threshold
      still_threshold:
        name: Gate 4 still threshold
    g5:
      move_threshold:
        name: Gate 5 move threshold
      still_threshold:
        name: Gate 5 still threshold
    g6:
      move_threshold:
        name: Gate 6 move threshold
      still_threshold:
        name: Gate 6 still threshold
    g7:
      move_threshold:
        name: Gate 7 move threshold
      still_threshold:
        name: Gate 7 still threshold
    g8:
      move_threshold:
        name: Gate 8 move threshold
      still_threshold:
        name: Gate 8 still threshold

select:
  - platform: ld2410
    ld2410_id: radar
    distance_resolution:
      name: Radar distance resolution
    # baud_rate is deliberately not exposed: changing it from Home Assistant would cut the UART link.

switch:
  - platform: ld2410
    ld2410_id: radar
    engineering_mode:
      name: Radar engineering mode
    bluetooth:
      name: Radar Bluetooth

button:
  - platform: ld2410
    ld2410_id: radar
    factory_reset:
      name: Radar factory reset
    restart:
      name: Radar restart
    query_params:
      name: Radar read settings

text_sensor:
  - platform: ld2410
    ld2410_id: radar
    version:
      name: Radar firmware
