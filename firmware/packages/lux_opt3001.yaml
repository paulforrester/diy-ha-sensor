# Illuminance: TI OPT3001 in the sealed light cell, at I2C address 0x45 (ADDR strapped to VCC; the SHT45 owns 0x44).
#
# - ESPHome's opt3001 uses the chip's automatic full-scale range and one 800 ms conversion per update (0.01 lx
#   steps at the lowest range, up to 83.9 klx), so 1 s polling gives a reading about every second in any light.
# - Reporting: a change of at least 10 % or 0.1 lx, whichever is larger, is sent at once, so a light switching on or
#   off reaches Home Assistant within about 2 s. Otherwise the value is re-sent at least every 60 s as a heartbeat.
# - Calibration: one multiplier for the aperture, set from the side-by-side run against the Apollo
#   (docs/calibration.md, Phase 4). Readings differ from the Apollo's LTR390, so the Arty Player thresholds
#   (2 lx on / 1 lx off) must be re-tuned if a unit replaces the Apollo.

number:
  - platform: template
    id: lux_calibration_factor
    name: Illuminance calibration factor
    icon: mdi:brightness-percent
    entity_category: config
    min_value: 0.1
    max_value: 10
    step: 0.001
    initial_value: 1.0
    restore_value: true
    optimistic: true
    mode: box

sensor:
  - platform: opt3001
    id: opt3001_lux
    i2c_id: i2c_main
    address: 0x45
    name: Illuminance
    update_interval: 1s
    accuracy_decimals: 2
    filters:
      - multiply: !lambda return id(lux_calibration_factor).state;
      - or:
          - throttle: 60s
          - lambda: |-
              static float last = NAN;
              if (std::isnan(last) || std::fabs(x - last) >= std::max(0.1f, 0.1f * last)) {
                last = x;
                return x;
              }
              return {};

binary_sensor:
  - platform: template
    name: Light sensor fault
    device_class: problem
    entity_category: diagnostic
    lambda: return id(opt3001_lux).is_failed() || id(opt3001_lux).status_has_warning();
