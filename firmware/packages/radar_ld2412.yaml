# Presence: HLK-LD2412 24 GHz radar on UART at 115200 baud (Hi-Link manual V1.01; ESPHome ld2412 docs).
#
# - Presence (has_target) is published as soon as the radar reports it. ESPHome's default 1 s settle filter
#   only damps repeated changes, so entry still shows within about 1 s.
# - Presence clears after the radar's own timeout ("Radar presence timeout", 0-900 s), set from Home Assistant.
# - All 14 gates expose move and still thresholds as numbers. Per-gate energies (engineering mode) are disabled by
#   default and enabled while tuning (docs/calibration.md, Phase 4).
# - Check "Radar firmware" after first boot: V1.26 is known to ignore configuration commands (esphome #13366).
# - The radar's Bluetooth is on from the factory: switch "Radar Bluetooth" off after tuning.

uart:
  id: uart_radar
  tx_pin: GPIO21     # XIAO D6 -> radar RX
  rx_pin: GPIO20     # XIAO D7 <- radar TX
  baud_rate: 115200
  parity: NONE
  stop_bits: 1

ld2412:
  id: radar
  uart_id: uart_radar

binary_sensor:
  - platform: ld2412
    ld2412_id: radar
    has_target:
      name: Presence
      device_class: occupancy
    has_moving_target:
      name: Moving target
    has_still_target:
      name: Still target
    dynamic_background_correction_status:
      name: Radar background correction running
      entity_category: diagnostic

sensor:
  - platform: ld2412
    ld2412_id: radar
    moving_distance:
      name: Moving distance
