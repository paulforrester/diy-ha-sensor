# Copy to secrets.yaml (git-ignored) and replace every value. Never commit secrets.yaml.
# Every key used by any config must exist here with a placeholder: CI builds its secrets from this file.

wifi_ssid: "your-2.4-GHz-ssid"
wifi_password: "your-wifi-password"
fallback_ap_password: "fallback-ap-password"   # used only if the unit can't join Wi-Fi
dns_domain: ".example.lan"                      # the site's DNS zone with a leading dot

# One API encryption key per device (32 random bytes, base64): generate each with `openssl rand -base64 32`.
# ESPHome rejects these placeholders on purpose until they are replaced. CI swaps in random keys
# (ci/make_ci_secrets.sh).
sense_bench_api_key: "REPLACE-WITH-openssl-rand-base64-32"
ci_api_key: "REPLACE-WITH-openssl-rand-base64-32"
